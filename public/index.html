<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AxeGozen - 1vs1 LOL-like Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    #gameContainer {
      position: relative;
    }
    #gameCanvas {
      border: 2px solid #4a4a6a;
      background: #2d2d44;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      z-index: 100;
    }
    .hpBar {
      width: 150px;
      height: 20px;
      background: #333;
      border: 1px solid #666;
      margin-bottom: 5px;
    }
    .hpFill {
      height: 100%;
      background: #e74c3c;
      transition: width 0.3s;
    }
    .skillBar {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .skill {
      width: 50px;
      height: 50px;
      background: #333;
      border: 2px solid #666;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      position: relative;
    }
    .cooldown {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0,0,0,0.7);
      transition: height 0.1s;
    }
    #controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">
      <div>Your HP:</div>
      <div class="hpBar">
        <div class="hpFill" id="playerHpFill"></div>
      </div>
      <div>Enemy HP:</div>
      <div class="hpBar">
        <div class="hpFill" id="enemyHpFill"></div>
      </div>
      <div class="skillBar">
        <div class="skill">
          <span>Q</span>
          <div class="cooldown" id="qCooldown"></div>
        </div>
        <div class="skill">
          <span>E</span>
          <div class="cooldown" id="eCooldown"></div>
        </div>
        <div class="skill">
          <span>Space</span>
          <div class="cooldown" id="spaceCooldown"></div>
        </div>
      </div>
    </div>
    <div id="controls">
      WASD: Move | Mouse: Aim | Space: Attack | E: Dash | Q: Special Attack
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
