<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena 1v1</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10161a; color: #eef3f6; font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; }
  #gameCanvas { display: block; width: 100%; height: 100%; }
  .bar { position: fixed; top: 14px; width: 34%; height: 16px; background: #0009; border: 1px solid #fff4; }
  .bar i { display: block; height: 100%; width: 100%; transition: width .12s; }
  #meBar { left: 14px; } #meBar i { background: #4fb3d9; }
  #foeBar { right: 14px; } #foeBar i { background: #d9574f; margin-left: auto; }
  #score { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: 700; letter-spacing: .08em; }
  #objective, #status { position: fixed; left: 14px; padding: 5px 9px; background: #10161ac9; border-radius: 4px; pointer-events: none; }
  #objective { top: 40px; font-weight: 700; } #status { top: 76px; font-size: 12px; }
  #modes { position: fixed; right: 14px; top: 44px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 45%; }
  #modes a, #modes button { font: inherit; font-size: 12px; color: #eef3f6; background: #162a36ed; border: 1px solid #9ac5de; border-radius: 4px; padding: 7px 10px; text-decoration: none; cursor: pointer; }
  #modes button[hidden] { display: none; }
  #msg { position: fixed; top: 22%; width: 100%; text-align: center; font-size: 22px; text-shadow: 0 2px 6px #000; pointer-events: none; }
  #skills { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .sk { position: relative; width: 58px; height: 58px; border: 2px solid #e6c15a; background: #0b1013cc; display: grid; place-items: center; font-weight: 700; font-size: 20px; overflow: hidden; }
  .sk small { position: absolute; bottom: 2px; right: 4px; font-size: 10px; font-weight: 400; opacity: .8; }
  .sk b { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: #000b; }
  #help { position: fixed; bottom: 6px; left: 12px; font-size: 12px; opacity: .8; max-width: 30%; background: #10161aaa; pointer-events: none; }
  .dmg { position: fixed; transform: translate(-50%, -50%); color: #ffd36a; font-weight: 700; font-size: 20px; text-shadow: 0 1px 3px #000; pointer-events: none; animation: rise .7s forwards; }
  @keyframes rise { to { transform: translate(-50%, -170%); opacity: 0; } }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="bar" id="meBar"><i id="playerHpFill"></i></div>
<div class="bar" id="foeBar"><i id="enemyHpFill"></i></div>
<div id="score">0 - 0</div>
<div id="objective">タワー残り　自陣 5/5　敵陣 5/5</div>
<div id="status"></div>
<nav id="modes" aria-label="ゲームモード">
  <a href="/">オンライン対戦</a>
  <a href="/?mode=solo">1人用テスト</a>
  <button id="restart" type="button" hidden>最初からテスト</button>
</nav>
<div id="msg">接続中…</div>
<div id="skills">
  <div class="sk" title="範囲斬り・命中で0.3秒スタン">Q<small>斬り・スタン</small><b id="qCooldown"></b></div>
  <div class="sk">E<small>ダッシュ</small><b id="eCooldown"></b></div>
  <div class="sk" title="3体召喚・最大5体">C<small>3体召喚</small><b id="cCooldown"></b></div>
  <div class="sk" title="5秒間で自陣に帰還。移動・攻撃・被ダメージで中断">B<small>リコール</small><b id="recallProgress"></b></div>
</div>
<div id="help">WASD: 移動 / 右クリック: 移動・敵やタワーを攻撃 / Q: 範囲斬り＋0.3秒スタン / E: ダッシュ / C: 3体召喚（最大5体） / B: 5秒リコール（移動・攻撃・被ダメージで中断、Bでキャンセル）<br>敵タワー5本を全て破壊すると勝利。安全地帯では無敵・毎秒80HP回復。復活は5秒＋自陣の破壊済みタワー数×5秒。</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
